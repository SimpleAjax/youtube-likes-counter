services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: likes
      POSTGRES_USER: likes
      POSTGRES_PASSWORD: likes
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U likes -d likes"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    image: migrate/migrate:v4.19.0
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "postgres://likes:likes@postgres:5432/likes?sslmode=disable", "up"]

  api:
    build: ./backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://likes:likes@postgres:5432/likes?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "5173:80"

  prometheus:
    image: prom/prometheus:v3.6.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  otel-collector:
    image: otel/opentelemetry-collector:0.162.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:3.1.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  grafana:
    image: grafana/grafana:12.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./observability/grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./observability/grafana/level-1.json:/etc/grafana/dashboards/level-1.json:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
    ports:
      - "3000:3000"

  k6:
    image: grafana/k6:1.3.0
    profiles: ["load"]
    volumes:
      - ./load:/scripts:ro
    environment:
      API_URL: http://api:8080
    command: ["run", "/scripts/baseline.js"]
    depends_on:
      - api

volumes:
  postgres-data:
  prometheus-data:
  tempo-data:
  grafana-data:
